name: CI

on:
  push:
    branches:
      - development
  pull_request:
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        required: true
      sign:
        type: boolean
        default: true
        required: false
      error-reporting-endpoint:
        type: string
        required: false
      non-fatal-error-reporting-endpoint:
        type: string
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_SECRET:
      GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID:
      GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID:
      GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY:
      APPLE_APPLICATION_CERT:
      APPLE_APPLICATION_CERT_PASSWORD:

env:
  NODE_VERSION: 24.22.1
  DESKTOP_ERROR_REPORTING_ENDPOINT: ${{ inputs.error-reporting-endpoint }}
  DESKTOP_NON_FATAL_ERROR_REPORTING_ENDPOINT:
    ${{ inputs.non-fatal-error-reporting-endpoint }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            vendor/*/package-lock.json
      # Встроенный Git для dugite качается при каждой установке зависимостей
      # (script/post-install.ts → npm ci --prefix app → dugite
      # script/download-git.js), и по умолчанию — в os.tmpdir(), то есть мимо
      # любого кеша. Переменная DUGITE_CACHE_DIR для этого и есть: config.js:46-56
      # берёт каталог из неё, а download-git.js:122-130, найдя там архив, не идёт
      # в сеть вовсе.
      #
      # Ключ — ровно по app/package-lock.json: версия dugite зафиксирована там,
      # а embedded-git.json приезжает внутри архива пакета, то есть до install
      # его в дереве нет и hashFiles по нему невозможен.
      #
      # restore-keys здесь нет и быть не может: при несовпадении контрольной
      # суммы download-git.js:123-127 удаляет архив и тут же зовёт unpackFile
      # уже на удалённый путь, необработанное отклонение роняет процесс, и
      # прогон падает вместо перескачки. Отсюда же отдельный каталог — не внутри
      # runner.temp/caches релизных workflow, где префиксный restore-keys как раз
      # и подсовывает устаревшее.
      - name: Cache the embedded Git archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dugite
          key: ${{ runner.os }}-dugite-${{ hashFiles('app/package-lock.json') }}
      - name: Point dugite at the cached archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dugite"
          echo "DUGITE_CACHE_DIR=$RUNNER_TEMP/dugite" >> "$GITHUB_ENV"
      # Скачивание архива и electron-бинаря — единственные места установки,
      # где прогон зависит от сети. Один DNS-отказ (прогон 38572695088:
      # getaddrinfo ENOTFOUND release-assets.githubusercontent.com) красил весь
      # джоб, хотя установка с первой же ошибки ни к чему не приводит: у
      # download-git.js:74-77 там process.exit(1). Поэтому три попытки с
      # нарастающей паузой: третья падает по-настоящему.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci упал (попытка ${attempt}/3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 30))
          done
          exit 1
      - run: npm run validate-electron-version
      - run: npm run lint
      - run: npm run validate-changelog
      - name: Untranslated form ceilings (fork measure)
        run: npm run l10n:untranslated
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Матрица целиком в JSON, а не списком с include: job-level `if` не
      # вычёркивает отдельную строку, а include-запись для os, которого нет в
      # списке, не вычёркивает комбинацию — она её добавляет.
      matrix:
        # Апстрим с 1937ac8c15 и 310a9bf9d7 гоняет на `windows-x64-large` бенчмарк
        # сравнения раннеров; стандартный образ при этом не удалён, и форк держит его:
        # платных larger-раннеров нашему личному репозиторию не нужно.
        ${{ fromJSON(github.repository == 'desktop/desktop' &&
        '{"os":["macos-15-xlarge","windows-2022"],"arch":["x64","arm64"],"include":[{"os":"macos-15-xlarge","friendlyName":"macOS"},{"os":"windows-2022","friendlyName":"Windows"}]}'
        ||
        '{"os":["windows-2022"],"arch":["x64","arm64"],"include":[{"os":"windows-2022","friendlyName":"Windows"}]}')
        }}
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Validate macOS version
        if: runner.os == 'macOS'
        run: npm run validate-macos-version
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          npm ci
          npm test
      - name: Start Windows unit tests alongside the build
        id: parallel-unit-tests
        if: |
          runner.os == 'Windows' && matrix.arch == 'x64' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          npm_config_arch: ${{ matrix.arch }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'desktop-unit-tests'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $command = @'
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          $directory = Join-Path $env:RUNNER_TEMP 'desktop-unit-tests'
          $logPath = Join-Path $directory 'output.log'
          $resultPath = Join-Path $directory 'result.json'
          $env:GITHUB_STEP_SUMMARY = Join-Path $directory 'summary.md'
          New-Item -ItemType File -Path $env:GITHUB_STEP_SUMMARY | Out-Null
          $startedAt = [DateTime]::UtcNow
          $exitCode = 1
          try {
            & npm.cmd run test:setup *> $logPath
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              & npm.cmd run test:unit *>> $logPath
              $exitCode = $LASTEXITCODE
            }
          } catch {
            $exitCode = 1
            $_ | Out-String | Add-Content $logPath
          } finally {
            @{
              exitCode = $exitCode
              startedAt = $startedAt.ToString('o')
              completedAt = [DateTime]::UtcNow.ToString('o')
            } | ConvertTo-Json | Set-Content "$resultPath.tmp"
            Move-Item "$resultPath.tmp" $resultPath
          }
          exit $exitCode
          '@
          $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          $process = Start-Process -FilePath (Get-Command pwsh).Source `
            -ArgumentList '-NoLogo', '-NoProfile', '-NonInteractive', '-EncodedCommand', $encodedCommand `
            -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          Set-Content (Join-Path $directory 'pid') $process.Id
      - name: Validate notarization API-key secrets
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
        run: |
          if [[ -z "$API_KEY_ID" || -z "$API_ISSUER_ID" || -z "$API_PRIVATE_KEY" ]]; then
            echo "::error::Set all three GATEWATCHER_APP_STORE_CONNECT_API secrets together for macOS release notarization."
            exit 1
          fi
      - name: Set up notarization API key
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        id: notarization-key
        uses: nodeselector/setup-apple-codesign@6b2173bdcb7dd4057e0396ccfa28ebfa4d90affa
        with:
          asset-type: app-store-connect-api-key
          app-store-connect-api-key-key-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          app-store-connect-api-key-issuer-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          app-store-connect-api-key-base64-private-key:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
      - name: Build production app
        run: npm run build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          APPLE_API_KEY_PATH:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-key-path }}
          APPLE_API_KEY_ID:
            ${{ steps.notarization-key.outputs.app-store-connect-api-key-key-id
            }}
          APPLE_API_ISSUER:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-issuer-id
            }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        if: steps.parallel-unit-tests.outcome != 'success'
        run: npm run test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: |
          ((runner.os == 'Windows' && matrix.arch == 'x64') || (runner.os == 'macOS' && matrix.arch == 'arm64')) &&
          steps.parallel-unit-tests.outcome != 'success'
        run: npm run test:unit
      - name: Run script tests
        run: npm run test:script
        env:
          npm_config_arch: ${{ matrix.arch }}
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: npm run package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Wait for Windows unit tests
        if:
          ${{ !cancelled() && steps.parallel-unit-tests.outcome == 'success' }}
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'desktop-unit-tests'
          $resultPath = Join-Path $directory 'result.json'
          $processId = [int](Get-Content (Join-Path $directory 'pid'))
          try {
            while (-not (Test-Path $resultPath)) {
              if ($null -eq (Get-Process -Id $processId -ErrorAction SilentlyContinue)) {
                if (-not (Test-Path $resultPath)) {
                  throw 'The unit-test process exited without recording a result.'
                }
                break
              }
              Start-Sleep -Seconds 2
            }
            $process = Get-Process -Id $processId -ErrorAction SilentlyContinue
            if ($null -ne $process) {
              $process | Wait-Process
            }
          } finally {
            Get-Content (Join-Path $directory 'output.log') -Encoding utf8
          }
          Get-Content (Join-Path $directory 'summary.md') -Raw -Encoding utf8 | Add-Content $env:GITHUB_STEP_SUMMARY
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $duration = ([DateTime]::Parse($result.completedAt) - [DateTime]::Parse($result.startedAt)).TotalSeconds
          $timing = "Background test setup and unit tests: $([Math]::Round($duration, 1)) seconds ($($result.startedAt) to $($result.completedAt))."
          Write-Host $timing
          Add-Content $env:GITHUB_STEP_SUMMARY $timing
          if ($result.exitCode -ne 0) {
            throw "Unit tests failed with exit code $($result.exitCode)."
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: ${{ inputs.upload-artifacts }}
        with:
          name: ${{matrix.friendlyName}}-${{matrix.arch}}
          path: |
            dist/GitHub Desktop-${{matrix.arch}}.zip
            dist/GitHubDesktop*-*.nupkg
            dist/GitHubDesktop*Setup-${{matrix.arch}}.exe
            dist/GitHubDesktop*Setup-${{matrix.arch}}.msi
            dist/bundle-size.json
            dist/bundle-hash.json
          if-no-files-found: error
  e2e-smoke:
    name: E2E Smoke ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Та же условная матрица целиком в JSON, что и у `build`: отдельную
      # строку `include` job-level `if` не вычёркивает, а форковая ветка
      # обязана остаться — она и есть признак форка.
      matrix:
        ${{ fromJSON(github.repository == 'desktop/desktop' &&
        '{"include":[{"os":"macos-15-xlarge","friendlyName":"macOS","arch":"arm64"},{"os":"windows-2022","friendlyName":"Windows","arch":"x64"}]}'
        ||
        '{"include":[{"os":"windows-2022","friendlyName":"Windows","arch":"x64"}]}')
        }}
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
          install-ffmpeg: 'true'
      - name: Validate notarization API-key secrets
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
        run: |
          if [[ -z "$API_KEY_ID" || -z "$API_ISSUER_ID" || -z "$API_PRIVATE_KEY" ]]; then
            echo "::error::Set all three GATEWATCHER_APP_STORE_CONNECT_API secrets together for macOS release notarization."
            exit 1
          fi
      - name: Set up notarization API key
        if:
          runner.os == 'macOS' && contains(fromJSON('["production", "beta",
          "test"]'), inputs.environment)
        id: notarization-key
        uses: nodeselector/setup-apple-codesign@6b2173bdcb7dd4057e0396ccfa28ebfa4d90affa
        with:
          asset-type: app-store-connect-api-key
          app-store-connect-api-key-key-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_KEY_ID }}
          app-store-connect-api-key-issuer-id:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_ISSUER_ID }}
          app-store-connect-api-key-base64-private-key:
            ${{ secrets.GATEWATCHER_APP_STORE_CONNECT_API_BASE64_PRIVATE_KEY }}
      - name: Build production app
        run: npm run build:prod
        env:
          DESKTOP_E2E_UPDATES_URL: http://127.0.0.1:51789/update
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          APPLE_API_KEY_PATH:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-key-path }}
          APPLE_API_KEY_ID:
            ${{ steps.notarization-key.outputs.app-store-connect-api-key-key-id
            }}
          APPLE_API_ISSUER:
            ${{
            steps.notarization-key.outputs.app-store-connect-api-key-issuer-id
            }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: npm run test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: npm run package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Install app on macOS
        if: runner.os == 'macOS'
        run: |
          rm -rf "/Applications/GitHub Desktop.app"
          ditto "dist/GitHub Desktop-darwin-arm64/GitHub Desktop.app" "/Applications/GitHub Desktop.app"
          echo "DESKTOP_E2E_APP_PATH=/Applications/GitHub Desktop.app/Contents/MacOS/GitHub Desktop" >> "$GITHUB_ENV"
      - name: Install app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem "dist/GitHubDesktop*Setup-${{ matrix.arch }}.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $setupExe) {
            throw "Unable to locate Windows setup executable in dist/"
          }

          # Имя каталога Squirrel в %LOCALAPPDATA% совпадает с идентификатором
          # продукта, который является префиксом имени setup-артефакта.
          $identifier = ($setupExe | Split-Path -Leaf) -replace 'Setup-[^-]+\.exe$', ''

          function Write-SquirrelLogs {
            $logPaths = @(
              "$env:LOCALAPPDATA\SquirrelSetup.log",
              "$env:LOCALAPPDATA\$identifier\SquirrelSetup.log"
            )

            foreach ($logPath in $logPaths) {
              if (Test-Path $logPath) {
                Write-Host "Showing log: $logPath"
                Get-Content $logPath -Tail 200
              }
            }
          }

          $installer = Start-Process -FilePath $setupExe -ArgumentList "/S" -PassThru

          try {
            Wait-Process -Id $installer.Id -Timeout 300 -ErrorAction Stop
          } catch {
            Write-SquirrelLogs
            throw "Windows installer timed out after 300 seconds"
          }

          Get-Process $identifier -ErrorAction SilentlyContinue | Stop-Process -Force

          $installedExe = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $installedExe; $attempt++) {
            $installedExe = Get-ChildItem "$env:LOCALAPPDATA\$identifier\app-*\$identifier.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $installedExe) {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $installedExe) {
            Write-SquirrelLogs
            throw "Unable to locate installed GitHub Desktop executable"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DESKTOP_E2E_APP_PATH=$installedExe"
      - name: Run packaged E2E smoke tests
        run: npm run test:e2e:run:packaged
      - name: Upload E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{matrix.friendlyName}}-${{matrix.arch}}
          path: playwright-videos/**
          if-no-files-found: warn
